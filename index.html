<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pack & move</title><style>
*{box-sizing:border-box}body{margin:0;background:#fcf9f5;color:#282526;font:14px/1.35 system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #41796d;outline-offset:2px}.app{height:100svh;max-width:620px;margin:auto;padding:max(18px,env(safe-area-inset-top)) 18px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow:hidden}header{display:flex;align-items:center;justify-content:space-between}h1{font:normal 29px/1.05 Georgia,serif;margin:0;letter-spacing:-.02em}.total{font-size:12px;color:#6c6560}.passport{display:flex;align-items:center;gap:9px;border:1px solid #86ac91;background:#eef4e9;border-radius:12px;padding:9px 12px;width:100%;text-align:left;min-height:47px;font-size:12px}.passport .symbol{font-size:24px;color:#486c50}.passport strong{display:block}.passport .arrow{margin-left:auto;font-size:20px}.bags{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bag{position:relative;border:2px solid transparent;background:transparent;border-radius:15px;min-width:0;padding:5px 3px 6px;transition:background .15s,border-color .15s;touch-action:none}.bag[aria-pressed=true]{background:#ece6dd;border-color:#8d8477}.bag.target{background:#e2efdf;border-color:#407852;transform:scale(1.04)}.bag svg{display:block;height:73px;width:70px;margin:0 auto 3px;overflow:visible}.bag .label{display:block;font-size:11px;font-weight:650;white-space:nowrap}.count{font-size:10px;color:#746d68}.passportmark{position:absolute;top:2px;right:5px;background:#eef4e9;border:1px solid #86ac91;border-radius:6px;padding:1px 4px;font-size:10px;color:#486c50;font-weight:700}.tray{background:#fff;border:1px solid #e5ded5;border-radius:19px;padding:15px;display:flex;flex-direction:column;flex:1;min-height:0}.trayhead{display:flex;align-items:center;gap:8px;margin-bottom:7px}.trayhead h2{font-size:19px;line-height:1.15;margin:0;flex:1}.trayhead .mini{font-size:11px;color:#716c66;white-space:nowrap}.instruction{font-size:11px;color:#7b736a;margin:0 0 10px}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chip{border:1px solid #e8e1d8;border-radius:13px;background:#fffaf3;padding:9px 8px;min-height:70px;display:flex;align-items:center;text-align:left;gap:7px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;position:relative}.chip .icon{width:27px;flex-shrink:0;font-size:24px;text-align:center}.chip .words{font-size:12px;line-height:1.25}.chip .check{position:absolute;top:4px;right:5px;color:#427550;font-size:12px;font-weight:700}.chip[aria-checked=true]{background:#edf4e9;border-color:#9bb898}.chip[aria-checked=true] .words{text-decoration:line-through;color:#6d786a}.chip.passports{border:2px solid #719177;background:#eef4e9}.chip.passports .words{font-weight:700}.chip.dragging{opacity:.28}.pager{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;gap:5px}.pager button{background:#fff;border:1px solid #e5ded5;border-radius:9px;width:44px;height:44px;font-size:22px}.pager button:disabled{opacity:.25;cursor:default}.page{font-size:11px;color:#7b736a;text-align:center}.empty{grid-column:1/-1;text-align:center;color:#7b736a;font-size:13px;padding:20px 0}.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:25px;font-size:10px;color:#7b736a}.foot button{background:none;border:0;text-decoration:underline;font-size:11px;padding:4px;min-height:44px}.ghost{position:fixed;pointer-events:none;z-index:20;width:140px;min-height:65px;padding:10px 12px;border:2px solid #588669;border-radius:14px;background:#fff8e8;box-shadow:0 8px 24px #342c342a;font-size:13px;font-weight:650;transform:rotate(-4deg);display:flex;align-items:center;gap:10px}.ghost .icon{font-size:27px}.status{position:fixed;left:18px;right:18px;bottom:14px;max-width:584px;margin:auto;background:#282526;color:#fff;padding:12px 14px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;z-index:5;font-size:12px;gap:10px}.status[hidden]{display:none}.status button{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px}.dialog{position:fixed;inset:0;background:#fcf9f5;z-index:30;padding:28px;display:flex;flex-direction:column;justify-content:center;gap:14px}.dialog[hidden]{display:none}.dialog h2{font:normal 28px Georgia,serif;margin:0}.dialog p{line-height:1.6;margin:0}.dialog button{min-height:44px;border:1px solid #c7bfb3;border-radius:10px;background:#fff}.dialog .destinations{display:grid;grid-template-columns:1fr 1fr;gap:8px}.storagefail{color:#a34830;font-weight:650}@media(max-height:720px){.app{padding-top:13px;gap:8px}.bag svg{height:61px;width:60px}.bag{padding:3px 2px 4px}.tray{padding:12px}.chip{min-height:65px;padding:7px}.trayhead h2{font-size:17px}.instruction{margin-bottom:8px}.passport{min-height:44px;padding:6px 10px}.pager{padding-top:7px}h1{font-size:27px}}@media(max-height:600px){.bag svg{height:48px}.chip{min-height:55px}.trayhead h2{font-size:16px}.instruction{font-size:10px}.foot{min-height:20px}.app{gap:6px}}
.headright{display:flex;align-items:center;gap:10px}.info{width:44px;height:44px;border:1px solid #ded7ce;border-radius:50%;background:#fff;font-size:20px}.foot button{min-height:44px;border:1px solid #ded7ce;background:#fff;border-radius:12px;padding:0 14px;text-decoration:none;font-size:12px}.instruction{font-size:11px}@media(max-height:720px){header{min-height:44px}.app{gap:6px}.bag svg{height:57px}.tray{padding:11px}.chip{min-height:62px}.trayhead h2{font-size:16px}} </style></head><body><main class="app"><header><h1>Pack & move.</h1><div class="headright"><span class="total" id="total"></span><button id="info" class="info" aria-label="Packing reminders">i</button></div></header><button class="passport" id="passport"><span class="symbol">▣</span><span><strong>Passports</strong><span id="where"></span></span><span class="arrow">↗</span></button><nav class="bags" id="bags" aria-label="Your six bags"></nav><section class="tray"><div class="trayhead"><h2 id="title"></h2><span class="mini" id="bagcount"></span></div><p class="instruction">Drag items into a bag · tap an item to mark packed</p><div class="items" id="items"></div><div class="pager"><button id="prev" aria-label="Previous items">‹</button><span class="page" id="page"></span><button id="next" aria-label="Next items">›</button></div></section><footer class="foot"><span id="storage">Saved in this browser</span><button id="movebutton" aria-label="Move an item without dragging">↗ Move items</button></footer></main><div class="status" id="status" hidden role="status"><span id="message"></span><button id="undo">Undo</button><button id="dismiss" aria-label="Dismiss message">×</button></div><section class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><h2 id="dialogtitle"></h2><p id="dialogtext"></p><div class="destinations" id="destinations"></div><button id="close">Back to packing</button></section><script>
const bags=[{"id": "bp1", "name": "Agam's backpack", "short": "Agam · Passports", "zone": "Plane", "hint": "Passports here · valuables + essentials", "items": ["Passports + wallet", "Phones + chargers", "Medicines", "Travel documents"]}, {"id": "bp2", "name": "Yasmin 🌯🍖🫦🫀's backpack", "short": "Yasmin", "zone": "Plane", "hint": "Kids within reach", "items": ["Snacks + empty water bottles", "Wipes + tissues", "Spare outfit for each child", "Small quiet toys / books"]}, {"id": "tr1", "name": "Pink trolley", "zone": "First night", "hint": "A little of everyone", "items": ["One outfit each", "Nightwear", "Underwear + socks", "Light layers"]}, {"id": "tr2", "name": "Blue trolley", "zone": "First night", "hint": "Wash + reset", "items": ["Small wash kit", "Backup outfits", "Arrival essentials", "Laundry bag"]}, {"id": "big1", "name": "S1", "zone": "Rest", "hint": "Half the family wardrobe", "items": ["Some clothes for everyone", "Some shoes", "Books + toys", "Bulky extras"]}, {"id": "big2", "name": "S2", "zone": "Rest", "hint": "The other half", "items": ["Remaining clothes for everyone", "Remaining shoes", "Large toiletries", "Other bulky items"]}];
const short=['Agam','Yasmin','Pink trolley','Blue trolley','S1','S2'],colors=['#91ad98','#b1a184','#d898af','#83a7bd','#78978b','#c2b198'],icons=['▣','🔌','💊','📄','🍎','🧻','👕','🧸','👕','🌙','🧦','🧥','🪥','👕','🛬','🧺','👕','👟','📚','📦','👕','👟','🧴','📦'];let selected='bp1',page=0,checked={},extras={},locations={},stored=true,lastMove=null,drag=null,holdTimer;
try{const old=JSON.parse(localStorage.getItem('packing.v1')||'{}');checked=old.checked||{};extras=old.extras||{};locations=JSON.parse(localStorage.getItem('packing.locations.v1')||'{}')}catch{stored=false}const all=[];bags.forEach((b,bi)=>b.items.concat(Array.isArray(extras[b.id])?extras[b.id].filter(x=>typeof x==='string').slice(0,12):[]).forEach((text,i)=>all.push({id:b.id+'-'+i,home:b.id,text,icon:i<4?icons[bi*4+i]:'📦'})));const valid=new Set(bags.map(b=>b.id));function place(x){return valid.has(locations[x.id])?locations[x.id]:x.home}function items(id){return all.filter(x=>place(x)===id)}function save(){try{localStorage.setItem('packing.v1',JSON.stringify({checked,extras}));localStorage.setItem('packing.locations.v1',JSON.stringify(locations))}catch{stored=false}}function svg(i){const c=colors[i];return i<2?`<svg viewBox="0 0 90 100" aria-hidden="true"><path d="M34 15V9a7 7 0 0 1 7-7h8a7 7 0 0 1 7 7v6" fill="none" stroke="#655f55" stroke-width="4"/><path d="M20 39Q20 13 45 13T70 39v46Q70 94 60 94H30Q20 94 20 85Z" fill="${c}" stroke="#665f56" stroke-width="2"/><rect x="27" y="51" width="36" height="30" rx="7" fill="#fff" fill-opacity=".18" stroke="#665f56" stroke-width="1.5"/><path d="M28 43h34M28 60h34" stroke="#665f56" stroke-width="2"/><path d="M14 50v29M76 50v29" stroke="${c}" stroke-width="9" stroke-linecap="round"/><rect x="40" y="23" width="10" height="8" rx="2" fill="#fcf9f5" fill-opacity=".6"/></svg>`:`<svg viewBox="0 0 90 100" aria-hidden="true"><path d="M33 16V3h24v13" fill="none" stroke="#655f55" stroke-width="4"/><rect x="16" y="17" width="58" height="74" rx="10" fill="${c}" stroke="#665f56" stroke-width="2"/><path d="M29 27v52M45 27v52M61 27v52" stroke="#665f56" stroke-opacity=".25" stroke-width="3"/><rect x="37" y="21" width="16" height="6" rx="2" fill="#fcf9f5" fill-opacity=".65"/><path d="M20 93v4M70 93v4" stroke="#655f55" stroke-width="5" stroke-linecap="round"/></svg>`}
function render(){const list=items(selected);page=Math.min(page,Math.max(0,Math.ceil(list.length/4)-1));const b=bags.find(b=>b.id===selected),p=place(all.find(x=>x.id==='bp1-0')),pi=bags.findIndex(b=>b.id===p);document.getElementById('total').textContent=all.filter(x=>checked[x.id]).length+'/'+all.length+' packed';document.getElementById('where').textContent='In '+bags[pi].name;document.getElementById('passport').onclick=()=>{selected=p;page=Math.floor(items(p).findIndex(x=>x.id==='bp1-0')/4);render()};document.getElementById('title').textContent=b.name;document.getElementById('bagcount').textContent=list.filter(x=>checked[x.id]).length+'/'+list.length;const nav=document.getElementById('bags');nav.replaceChildren();bags.forEach((b,i)=>{const el=document.createElement('button');el.className='bag';el.dataset.bag=b.id;el.setAttribute('aria-label',b.name+(p===b.id?', passports here':''));el.setAttribute('aria-pressed',String(b.id===selected));el.innerHTML=svg(i);const label=document.createElement('span');label.className='label';label.textContent=short[i];const count=document.createElement('span');count.className='count';count.textContent=items(b.id).length+' items';el.append(label,count);if(p===b.id){const marker=document.createElement('span');marker.className='passportmark';marker.textContent='▣';marker.setAttribute('aria-hidden','true');el.append(marker)}el.onclick=()=>{selected=b.id;page=0;render()};nav.append(el)});const grid=document.getElementById('items');grid.replaceChildren();list.slice(page*4,page*4+4).forEach(x=>{const el=document.createElement('button');el.className='chip'+(x.id==='bp1-0'?' passports':'');el.dataset.item=x.id;el.setAttribute('role','checkbox');el.setAttribute('aria-label',x.text);el.setAttribute('aria-checked',String(!!checked[x.id]));const icon=document.createElement('span');icon.className='icon';icon.textContent=x.icon;icon.setAttribute('aria-hidden','true');const words=document.createElement('span');words.className='words';words.textContent=x.text;el.append(icon,words);if(checked[x.id]){const c=document.createElement('span');c.className='check';c.textContent='✓';c.setAttribute('aria-hidden','true');el.append(c)}el.addEventListener('pointerdown',e=>begin(e,x,el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tick(x)}if(e.key.toLowerCase()==='m'){e.preventDefault();choose(x)}});el.addEventListener('click',e=>{if(e.detail===0&&!drag)tick(x)});grid.append(el)});if(!list.length){const n=document.createElement('div');n.className='empty';n.textContent='Empty bag. Drag something here.';grid.append(n)}document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=(page+1)*4>=list.length;document.getElementById('page').textContent=list.length?'Items '+(page*4+1)+'–'+Math.min((page+1)*4,list.length)+' of '+list.length:'No items';document.getElementById('storage').textContent=stored?'Saved in this browser':'Not saved · page only';document.getElementById('storage').className=stored?'':'storagefail'}function tick(x){checked[x.id]=!checked[x.id];save();render()}function move(x,to){const from=place(x);if(from===to)return;lastMove={id:x.id,from,to};locations[x.id]=to;save();selected=to;page=Math.floor(items(to).findIndex(y=>y.id===x.id)/4);render();document.getElementById('message').textContent=x.text+' → '+short[bags.findIndex(b=>b.id===to)];document.getElementById('status').hidden=false}
function begin(e,x,el){if(e.button!==0||drag)return;e.preventDefault();document.getElementById('status').hidden=true;drag={x,startX:e.clientX,startY:e.clientY,x0:e.clientX,y0:e.clientY,el,pointer:e.pointerId,moved:false,ghost:null,target:null};el.setPointerCapture(e.pointerId);holdTimer=null}document.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.pointer)return;const d=drag;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>8&&!d.moved){clearTimeout(holdTimer);d.moved=true;d.el.classList.add('dragging');const g=document.createElement('div');g.className='ghost';const icon=document.createElement('span');icon.className='icon';icon.textContent=d.x.icon;const text=document.createElement('span');text.textContent=d.x.text;g.append(icon,text);document.body.append(g);d.ghost=g}if(d.moved){e.preventDefault();d.ghost.style.left=Math.max(5,Math.min(innerWidth-145,e.clientX-70))+'px';d.ghost.style.top=(e.clientY-48)+'px';const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-bag]');d.target=hit?.dataset.bag||null;document.querySelectorAll('.bag').forEach(b=>b.classList.toggle('target',b===hit))}},{passive:false});document.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.pointer)return;clearTimeout(holdTimer);const d=drag;drag=null;d.ghost?.remove();d.el.classList.remove('dragging');document.querySelectorAll('.bag').forEach(b=>b.classList.remove('target'));if(d.moved){if(d.target)move(d.x,d.target)}else tick(d.x)});document.addEventListener('pointercancel',()=>{clearTimeout(holdTimer);drag?.ghost?.remove();drag?.el.classList.remove('dragging');drag=null;document.querySelectorAll('.bag').forEach(b=>b.classList.remove('target'))});
document.getElementById('movebutton').onclick=()=>{const list=items(selected);document.getElementById('dialogtitle').textContent='Move an item';document.getElementById('dialogtext').textContent='Pick an item, then its new bag.';const dest=document.getElementById('destinations');dest.replaceChildren();list.slice(page*4,page*4+4).forEach(x=>{const bt=document.createElement('button');bt.textContent=x.text;bt.onclick=()=>choose(x);dest.append(bt)});document.getElementById('dialog').hidden=false;document.getElementById('close').focus()};function choose(x){document.getElementById('dialogtitle').textContent='Move '+x.text;document.getElementById('dialogtext').textContent='Choose its bag.';const dest=document.getElementById('destinations');dest.replaceChildren();bags.forEach((b,i)=>{const bt=document.createElement('button');bt.textContent=short[i];bt.disabled=place(x)===b.id;bt.onclick=()=>{close();move(x,b.id)};dest.append(bt)});document.getElementById('dialog').hidden=false;document.getElementById('close').focus()}function close(){document.getElementById('dialog').hidden=true;document.getElementById('destinations').replaceChildren()}document.getElementById('close').onclick=close;document.getElementById('info').onclick=()=>{document.getElementById('dialogtitle').textContent='Before you zip up';document.getElementById('dialogtext').textContent='A starting plan, not a confirmed inventory. Split clothes across both big cases. Confirm airline bag, weight, liquid and battery rules. Ticks and moves stay in this browser only. Keyboard: Enter to pack, M to move.';document.getElementById('destinations').replaceChildren();document.getElementById('dialog').hidden=false;document.getElementById('close').focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(!document.getElementById('dialog').hidden&&e.key==='Tab'){const a=[...document.querySelectorAll('#dialog button:not(:disabled)')],i=a.indexOf(document.activeElement);e.preventDefault();a[(i+(e.shiftKey?-1:1)+a.length)%a.length].focus()}});document.getElementById('undo').onclick=()=>{if(!lastMove)return;locations[lastMove.id]=lastMove.from;selected=lastMove.from;save();render();document.getElementById('status').hidden=true;lastMove=null};document.getElementById('dismiss').onclick=()=>document.getElementById('status').hidden=true;document.getElementById('prev').onclick=()=>{page--;render()};document.getElementById('next').onclick=()=>{page++;render()};render();
</script></body></html>
