<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Six bags, one packing plan</title><style>
:root{--ink:#251f21;--muted:#585254;--rule:#eae9ea;--teal:#73a89a;--ground:#f4efec}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}.app{height:100svh;max-width:620px;margin:auto;display:flex;flex-direction:column;gap:14px;padding: max(18px,env(safe-area-inset-top)) 20px max(14px,env(safe-area-inset-bottom));overflow:hidden}header{display:flex;align-items:center;justify-content:space-between}h1{font:400 28px/1.1 Georgia,serif;margin:0;letter-spacing:-.025em}.sub{font-size:12px;color:var(--muted);margin:5px 0 0}.info{border:1px solid var(--rule);border-radius:50%;width:44px;height:44px;background:white;font-size:20px}.progressline{display:flex;gap:12px;align-items:center;font-size:12px;font-weight:600}.track{height:6px;flex:1;border-radius:8px;background:var(--rule);overflow:hidden}.fill{height:100%;background:var(--teal);transition:width .25s}.card{border:1px solid var(--rule);border-radius:20px;flex:1;min-height:0;padding:20px;display:flex;flex-direction:column;position:relative;background:linear-gradient(155deg,#fff 60%,#f3f8f6)}.eyebrow{display:flex;justify-content:space-between;align-items:center;color:var(--teal);font-size:12px;font-weight:600}.bagtitle{font-size:25px;line-height:1.2;margin:10px 0 4px}.hint{color:var(--muted);font-size:13px;margin:0}.rows{display:flex;flex-direction:column;gap:9px;margin:22px 0 12px}.item{display:flex;align-items:center;gap:12px;border:1px solid var(--rule);border-radius:10px;background:white;text-align:left;padding:12px;min-height:55px;font-size:14px;line-height:1.3}.box{border:1.5px solid #aaa;width:23px;height:23px;border-radius:6px;flex-shrink:0;display:grid;place-items:center;color:white}.item[aria-checked=true]{background:#eaf3ef;border-color:#b6d2c9}.item[aria-checked=true] .box{background:var(--teal);border-color:var(--teal)}.item[aria-checked=true] .text{color:var(--muted);text-decoration:line-through}.cardfooter{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.navbtn{border:1px solid var(--rule);border-radius:10px;background:white;width:48px;height:44px;font-size:23px}.pagehint{color:var(--muted);text-align:center;font-size:12px}.baggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.bagtab{border:1px solid var(--rule);border-radius:10px;background:white;min-height:52px;font-size:12px;line-height:1.3;padding:7px 4px}.bagtab[aria-current=true]{border-color:var(--teal);background:#eaf3ef;color:#3e7163;font-weight:600}.tinycount{display:block;font-size:10px;color:var(--muted);margin-top:3px}.storage{text-align:center;color:var(--muted);font-size:10px;margin:0;min-height:14px}.empty-note{text-align:center;color:#3e7163;font-size:12px}.overlay{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;padding:24px;z-index:10}.overlay[hidden]{display:none}.infocard{max-width:380px;width:100%}.infocard h2{font:400 28px Georgia,serif}.infocard p{font-size:16px;line-height:1.6}.close{height:48px;background:var(--teal);color:white;border:0;border-radius:8px;width:100%;font-weight:600}.infopager{display:flex;gap:8px;margin:24px 0}.infopager button{flex:1;border:1px solid var(--rule);height:44px;background:white;border-radius:8px}@media(max-height:720px){.app{gap:10px;padding-top:14px;padding-bottom:10px}.card{padding:16px}.rows{margin-top:16px;gap:7px}.item{min-height:48px;padding:10px}.baggrid{gap:6px}.bagtab{min-height:46px}.bagtitle{font-size:23px}h1{font-size:26px}}@media(max-height:600px){.app{gap:7px}.sub{display:none}.rows{margin:10px 0}.item{min-height:44px;padding:8px}.card{padding:12px}.bagtitle{margin-top:6px}.bagtab{min-height:44px}.storage{font-size:9px}}
.item.passport{border:2px solid #3e7163;background:#f0f7f3}.item.passport .text{font-weight:700}.bagtab:first-child{border-color:#3e7163}@media(max-height:720px){.bagtitle{font-size:21px}.rows{margin-top:12px;gap:6px}.item{min-height:46px;padding:9px}}</style></head><body><main class="app"><header><div><h1>Pack one bag.</h1><p class="sub">Six bags. Everything in its place.</p></div><button class="info" aria-label="Packing reminders" id="info">i</button></header><div class="progressline"><span id="counter"></span><div class="track" role="progressbar" aria-label="Total packing progress" aria-valuemin="0"><div class="fill"></div></div></div><section class="card" id="card" aria-label="Current bag"><div class="eyebrow"><span id="zone"></span><span id="bagcount"></span></div><h2 class="bagtitle" id="bagtitle"></h2><p class="hint" id="hint"></p><div class="rows" id="rows"></div><div class="cardfooter"><button class="navbtn" id="prev" aria-label="Previous bag or items">‹</button><span class="pagehint" id="pagehint"></span><button class="navbtn" id="next" aria-label="Next bag or items">›</button></div></section><nav class="baggrid" aria-label="Choose a bag" id="bags"></nav><p class="storage" id="storage"></p></main><section class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="infotitle"><div class="infocard"><h2 id="infotitle"></h2><p id="infobody"></p><div class="infopager"><button id="infoprev">Back</button><button id="infonext">Next</button></div><button class="close" id="close">Back to packing</button></div></section><script>const bags = [
 {"id":"bp1","name":"Agam's backpack","short":"Agam · Passports","zone":"Plane","hint":"Passports here · valuables + essentials","items":["Passports + wallet","Phones + chargers","Medicines","Travel documents"]},
 {"id":"bp2","name":"Yasmin 🌯🍖🫦🫀's backpack","short":"Yasmin","zone":"Plane","hint":"Kids within reach","items":["Snacks + empty water bottles","Wipes + tissues","Spare outfit for each child","Small quiet toys / books"]},
 {"id":"tr1","name":"Pink trolley","zone":"First night","hint":"A little of everyone","items":["One outfit each","Nightwear","Underwear + socks","Light layers"]},
 {"id":"tr2","name":"Blue trolley","zone":"First night","hint":"Wash + reset","items":["Small wash kit","Backup outfits","Arrival essentials","Laundry bag"]},
 {"id":"big1","name":"S1","zone":"Rest","hint":"Half the family wardrobe","items":["Some clothes for everyone","Some shoes","Books + toys","Bulky extras"]},
 {"id":"big2","name":"S2","zone":"Rest","hint":"The other half","items":["Remaining clothes for everyone","Remaining shoes","Large toiletries","Other bulky items"]}
];
</script><script>
const key='packing.v1';let state={checked:{},extras:{}},selected=0,page=0,stored=true;try{const raw=JSON.parse(localStorage.getItem(key)||'null');if(raw&&raw.checked&&typeof raw.checked==='object'){state.checked=raw.checked;state.extras=raw.extras||{}}}catch{stored=false}function items(b){return b.items.concat(Array.isArray(state.extras[b.id])?state.extras[b.id].filter(v=>typeof v==='string').slice(0,12):[])}function save(){try{if(stored)localStorage.setItem(key,JSON.stringify(state))}catch{stored=false}}function render(){const b=bags[selected],list=items(b),n=list.filter((_,i)=>state.checked[b.id+'-'+i]).length;document.getElementById('zone').textContent=b.zone;document.getElementById('bagcount').textContent=n+' / '+list.length;document.getElementById('bagtitle').textContent=b.name;document.getElementById('hint').textContent=b.hint;const rows=document.getElementById('rows');rows.replaceChildren();list.slice(page*4,page*4+4).forEach((text,j)=>{const i=page*4+j,id=b.id+'-'+i,done=!!state.checked[id],el=document.createElement('button');el.className='item'+(b.id==='bp1'&&i===0?' passport':'');el.setAttribute('role','checkbox');el.setAttribute('aria-checked',String(done));const box=document.createElement('span');box.className='box';box.textContent=done?'✓':'';box.setAttribute('aria-hidden','true');const label=document.createElement('span');label.className='text';label.textContent=text;el.append(box,label);el.onclick=()=>{state.checked[id]=!state.checked[id];save();render();document.getElementById('rows').children[j]?.focus({preventScroll:true})};rows.append(el)});const all=bags.flatMap(b=>items(b).map((_,i)=>b.id+'-'+i)),total=all.filter(id=>state.checked[id]).length;document.getElementById('counter').textContent=total+' / '+all.length+' packed';document.querySelector('.fill').style.width=(100*total/all.length)+'%';document.querySelector('.track').setAttribute('aria-valuemax',all.length);document.querySelector('.track').setAttribute('aria-valuenow',total);document.getElementById('pagehint').textContent=list.length>4?'Items '+(page*4+1)+'-'+Math.min(list.length,page*4+4)+' of '+list.length:(n===list.length?'Bag ready ✓':'Swipe or choose a bag');const nav=document.getElementById('bags');nav.replaceChildren();bags.forEach((b,i)=>{const el=document.createElement('button');el.className='bagtab';el.setAttribute('aria-current',String(i===selected));el.textContent=b.short||b.name;el.setAttribute('aria-label',b.name);const c=document.createElement('span');c.className='tinycount';c.textContent=items(b).filter((_,j)=>state.checked[b.id+'-'+j]).length+'/'+items(b).length+' packed';el.append(c);el.onclick=()=>{selected=i;page=0;render()};nav.append(el)});document.getElementById('storage').textContent=stored?'Saved in this browser · no cross-device sync':'Not saved · ticks last only while this page is open'}function step(dir){const last=Math.ceil(items(bags[selected]).length/4)-1;if(dir>0&&page<last)page++;else if(dir<0&&page>0)page--;else{selected=(selected+dir+bags.length)%bags.length;page=dir<0?Math.ceil(items(bags[selected]).length/4)-1:0}render()}document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);let start;document.getElementById('card').addEventListener('touchstart',e=>start={x:e.changedTouches[0].clientX,y:e.changedTouches[0].clientY},{passive:true});document.getElementById('card').addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>65&&Math.abs(dy)<45)step(dx<0?1:-1);start=null},{passive:true});const info=[['Before you zip up','Confirm which bags can fly in the cabin, their weight limits and liquid rules. Put batteries where your airline requires.'],['A starting plan','This is a starting plan, not a confirmed inventory. Split clothes across both big cases.']];let infoindex=0;function showinfo(){document.getElementById('infotitle').textContent=info[infoindex][0];document.getElementById('infobody').textContent=info[infoindex][1]}document.getElementById('info').onclick=()=>{infoindex=0;showinfo();document.getElementById('overlay').hidden=false;document.getElementById('close').focus()};document.getElementById('close').onclick=()=>{document.getElementById('overlay').hidden=true;document.getElementById('info').focus()};document.getElementById('infoprev').onclick=document.getElementById('infonext').onclick=()=>{infoindex=1-infoindex;showinfo()};document.addEventListener('keydown',e=>{if(document.getElementById('overlay').hidden)return;if(e.key==='Escape')document.getElementById('close').click();if(e.key==='Tab'){const a=[document.getElementById('infoprev'),document.getElementById('infonext'),document.getElementById('close')],i=a.indexOf(document.activeElement);e.preventDefault();a[(i+(e.shiftKey?-1:1)+a.length)%a.length].focus()}});render();
</script></body></html>
